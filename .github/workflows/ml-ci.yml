name: ML Pipeline CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Membangun_model/requirements.txt

      - name: Compile Python scripts
        run: |
          python -m py_compile \
            preprocessing/automate_Jaelani_Surya_Saputra.py \
            Membangun_model/modelling.py \
            Membangun_model/modelling_tuning.py \
            "Monitoring dan Logging/3.prometheus_exporter.py" \
            "Monitoring dan Logging/7.inference.py"

      - name: Run preprocessing
        run: python preprocessing/automate_Jaelani_Surya_Saputra.py

      - name: Train baseline model
        run: python Membangun_model/modelling.py

      - name: Run inference smoke test
        run: python "Monitoring dan Logging/7.inference.py" --rows 3

      - name: Run Prometheus exporter smoke test
        run: python "Monitoring dan Logging/3.prometheus_exporter.py" --once
